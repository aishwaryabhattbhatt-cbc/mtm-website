<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Noise Distortion Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .controls-info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            color: #aaa;
            pointer-events: none;
            z-index: 100;
            max-width: 250px;
            line-height: 1.6;
        }
        .file-input-wrapper {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 50;
        }
        .file-input-wrapper input {
            display: none;
        }
        .file-input-label {
            padding: 12px 20px;
            background: rgba(100, 150, 255, 0.8);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-block;
        }
        .file-input-label:hover {
            background: rgba(100, 150, 255, 1);
            transform: scale(1.05);
        }
        #dropZone {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        #dropZone.dragover {
            background: rgba(100, 150, 255, 0.2);
            border: 2px dashed rgba(100, 150, 255, 0.5);
            pointer-events: all;
        }
        .drop-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
            color: rgba(100, 150, 255, 0.7);
            opacity: 0;
            pointer-events: none;
        }
        #dropZone.dragover .drop-hint {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="controls-info">
            <strong>WebGL Noise Distortion</strong><br>
            Use the GUI panel (top-right) to adjust:<br>
            • Intensity: warp strength<br>
            • Noise Scale: pattern size<br>
            • Speed: animation speed<br>
            • Octaves: turbulence layers<br>
            • Aspect: cover/contain mode<br>
            <br>
            <strong>Drag & drop</strong> an image to replace texture.
        </div>
        <div id="dropZone">
            <div class="drop-hint">📷 Drop Image Here</div>
        </div>
        <div class="file-input-wrapper">
            <label class="file-input-label" for="imageInput">📁 Load Image</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
