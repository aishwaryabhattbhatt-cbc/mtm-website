    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script>
        let particles = [];
        let zoff = 0;

        function setup() {
          const canvas = createCanvas(1920, 850, WEBGL);
          canvas.parent('p5-background');
          noStroke();
          pixelDensity(1);

          mouseX = -2000;
          mouseY = -2000;

          let pCols = 100;
          let pRows = 50;

          for (let i = 0; i <= pCols; i++) {
            let x = (i / pCols) * width;
            for (let j = 0; j <= pRows; j++) {
              let y = (j / pRows) * height;
              particles.push(new Particle(x, y, i, j));
            }
          }
        }

        function draw() {
          background(255);

          let timeFactor = millis() / 6000 * TWO_PI;
          let shift = sin(timeFactor) * 0.5;

          let colTopLeft     = shiftColor(color('#03a0e9'), shift);
          let colTopRight    = shiftColor(color('#ad02b3'), -shift);
          let colMidLeft     = shiftColor(color('#c903f4'), shift * 0.7);
          let colMidRight    = shiftColor(color('#03e9e1'), -shift * 0.7);
          let colBottom      = color(255);

          push();
          translate(-width / 2, -height / 2);
          drawCustomBackground(colTopLeft, colTopRight, colMidLeft, colMidRight, colBottom);

          let mx = mouseX;
          let my = mouseY;

          for (let p of particles) {
            p.update(mx, my, zoff);
            p.show();
          }
          pop();

          zoff += 0.005;
        }

        function shiftColor(c, amt) {
          let r = red(c) * (1 + amt);
          let g = green(c) * (1 + amt);
          let b = blue(c) * (1 + amt);
          return color(constrain(r, 0, 255), constrain(g, 0, 255), constrain(b, 0, 255));
        }

        class Particle {
          constructor(x, y, gridX, gridY) {
            this.pos = createVector(x, y);
            this.gridX = gridX;
            this.gridY = gridY;
            this.currentSize = 0;
            this.sizeVel = 0;
            this.sizeAcc = 0;
            this.tightness = 0.15;
            this.dampening = 0.8;
          }

          update(mx, my, z) {
            let n = noise(this.gridX * 0.1, this.gridY * 0.1, z);
            let baseSize = map(pow(n, 2), 0, 1, 15, 4);

            let pulseSpeed = millis() / 3000 * TWO_PI;
            let pulseOffset = (this.gridX + this.gridY) * 0.1;
            let pulseFactor = map(sin(pulseSpeed + pulseOffset), -1, 1, 0.9, 1.1);

            let dx1 = abs(this.gridX - 30) / 25;
            let dy1 = abs(this.gridY - 25) / 20;
            let factor1 = map(max(dx1, dy1), 0.6, 1.2, 0.2, 1.0, true);

            let dx2 = abs(this.gridX - 85) / 20;
            let dy2 = abs(this.gridY - 12) / 15;
            let factor2 = map(max(dx2, dy2), 0.3, 1.3, 0.3, 1.0, true);

            let dx3 = abs(this.gridX - 90) / 35;
            let dy3 = abs(this.gridY - 45) / 25;
            let factor3 = map(max(dx3, dy3), 0.1, 2.0, 0.1, 1.0, true);

            let legibility = min(factor1, min(factor2, factor3));
            let targetSize = baseSize * legibility * pulseFactor;

            if (mx > -1000) {
              let d = dist(this.pos.x, this.pos.y, mx, my);
              if (d < 400) {
                let verticalPower = map(my, 0, height, 1.8, 4.0, true);
                let hoverScale = map(d, 0, 400, verticalPower, 1);
                targetSize *= hoverScale;
              }
            }

            targetSize = min(targetSize, 18.5);

            let displacement = targetSize - this.currentSize;
            let force = displacement * this.tightness;
            this.sizeAcc = force;
            this.sizeVel += this.sizeAcc;
            this.currentSize += this.sizeVel;
            this.sizeAcc = 0;
            this.sizeVel *= this.dampening;
          }

          show() {
            if (this.currentSize > 0.1) {
              fill(255);
              ellipse(this.pos.x, this.pos.y, this.currentSize);
            }
          }
        }

        function drawCustomBackground(tl, tr, ml, mr, bot) {
          let cols = 3;
          beginShape(QUAD_STRIP);
          for (let x = 0; x <= cols; x++) {
            let u = x / cols;
            fill(lerpColor(tl, tr, u)); vertex(u * width, 0);
            fill(lerpColor(ml, mr, u)); vertex(u * width, height * 0.66);
          }
          endShape();
          beginShape(QUAD_STRIP);
          for (let x = 0; x <= cols; x++) {
            let u = x / cols;
            fill(lerpColor(ml, mr, u)); vertex(u * width, height * 0.66);
            fill(bot); vertex(u * width, height);
          }
          endShape();
        }
    </script>
